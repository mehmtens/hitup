version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app1:
    build: .
    command: ["./server", "-port=8081", "-dbhost=postgres:5432", "-redishost=redis:6379"]
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads_data:/app/uploads

  app2:
    build: .
    command: ["./server", "-port=8081", "-dbhost=postgres:5432", "-redishost=redis:6379"]
    depends_on:
      - postgres
      - redis
    volumes:
      - uploads_data:/app/uploads

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  postgres_data:
  uploads_data:
